# Add this file to your repository at:
#
#   .github/workflows/chainreaction-validate.yml
#
# ChainReaction dispatches this workflow to validate a cascade before it
# merges. It holds NO secret: it exchanges a GitHub-issued OIDC token for a
# short-lived, cascade-scoped token at the control plane, then hands off to
# the published validator package, which does the real checkout/build/test
# work. See the "Adding the validation workflow" section of this project's
# README for what to configure and why ChainReaction cannot add this file
# for you.
#
# This file's PATH — .github/workflows/chainreaction-validate.yml — is what
# Prepare verifies exists on your default branch. That path must not change.
#
# The job name below (chainreaction-validate) is cosmetic: it is what a human
# reads in the Actions log and in the run list, nothing more. It is NOT a
# required status check — this workflow only ever runs via workflow_dispatch,
# and a required status check is evaluated against a pull request's head
# commit, which a dispatched run never attaches to. The status check your
# branch protection actually requires is your own CI's existing check (e.g.
# "build", "test", "ci") — set that via CR_REQUIRED_CHECKS, never the name of
# this job. Rename this job freely; it changes nothing about how Prepare or
# the cascade validates this repo.
name: ChainReaction Validate

on:
  workflow_dispatch:
    inputs:
      cascade_id:
        description: The cascade this run validates.
        required: true
        type: string

# No other permission is requested. This workflow never pushes, never opens
# a PR, and never touches repository contents beyond reading them.
permissions:
  id-token: write # request the OIDC token exchanged below
  contents: read

env:
  # Override any of these with a repository or organization Actions variable
  # of the same name if you point this workflow at a different deployment.
  CR_URL: ${{ vars.CHAINREACTION_URL || 'https://chainreaction.dev' }}
  CR_AUDIENCE: ${{ vars.CHAINREACTION_AUDIENCE || 'chainreaction' }}
  CR_VALIDATE_PACKAGE: ${{ vars.CHAINREACTION_VALIDATE_PACKAGE || '@chainreaction/validate' }}

jobs:
  chainreaction-validate:
    name: chainreaction-validate
    runs-on: ubuntu-latest
    steps:
      - uses: oven-sh/setup-bun@v2

      # Requests this run's OIDC token and exchanges it at the control plane
      # for a scoped, short-lived token plus the changeset to validate.
      #
      # The exchange's response — which carries that token — is written
      # straight to a file. It is never echoed to the log and never captured
      # as a step output, and the token is masked the instant it is read
      # back out of that file, before anything downstream gets a chance to
      # print it.
      - name: Claim this cascade
        run: |
          set -euo pipefail
          oidc=$(curl -sS -H "authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$CR_AUDIENCE" | jq -r .value)
          curl -sS -X POST "$CR_URL/api/ci/claim" \
            -H "authorization: Bearer $oidc" \
            -H "content-type: application/json" \
            -d "{\"cascade_id\":\"${{ inputs.cascade_id }}\"}" \
            -o "$RUNNER_TEMP/chainreaction-claim.json"
          token=$(jq -r .token "$RUNNER_TEMP/chainreaction-claim.json")
          echo "::add-mask::$token"

      # The claim file — still only on disk, never in a log or a step output
      # — carries both the token and the changeset. The validator package
      # reads it directly, so the token never has to cross a step boundary.
      - name: Assemble the workspace and validate
        run: bunx "$CR_VALIDATE_PACKAGE" "$RUNNER_TEMP/chainreaction-claim.json"
